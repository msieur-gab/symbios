# DHCP on the USB link only. The board is reached at 10.55.0.1 and is not a router: no
# gateway (option 3) and no DNS (option 6) are advertised, so the computer that plugs in
# keeps its own internet. No DNS server at all (port=0).
interface=usbbr
bind-interfaces
port=0
dhcp-authoritative
dhcp-range=10.55.0.10,10.55.0.50,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
