# The desk's settings that change with where things live, read by server.py at start.
# One "name = value" per line; a line starting with # is a note.

# Where the phone's companion page lives: the only sites allowed to call the desk from a browser.
# Several addresses, separated by spaces, while moving from one to the next; "none" lets no site in.
# Change it here, then pull on the board and restart the desk.
companion = none

# Limits for heavy work (jobs.py): memos, embedding, the Ask service. Left out, a board gets the Orange Pi Zero 2W's:
# job_memory_high = 600M, job_memory_max = 800M, job_cpu = 200%, ask_memory_high = 200M, ask_memory_max = 300M,
# ask_cpu = 200%, speech_piece_seconds = 30, speech_chunk_seconds = 60 (a memo read a minute at a time, a fresh run of
# the model each: on 24 Nov a 4:09 memo peaked at 457 MB this way, 813 MB in one run). A Luckfox Lyra Zero W (464 MB, swap on the SD card):
# job_memory_high = 300M
# job_memory_max = 360M
# job_cpu = none
# ask_memory_high = 150M
# ask_memory_max = 200M
# ask_cpu = none
# speech_piece_seconds = 20

# Mesh, the desk's own: a Meshtastic radio plugged in by USB (or reached over WiFi) is found by itself.
# mesh_device = auto, usb, serial, /dev/ttyACM0, tcp:host, or off (a radio left alone); mesh_folder = where its messages are kept (in the home: Mesh).
mesh_device = auto

# Add-ons: Python packages that bring a window and routes of their own (addons.py), separated by spaces.
# One not installed on this board is left out, and said in the desk's log. None for now.
# addons =
