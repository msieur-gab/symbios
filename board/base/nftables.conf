#!/usr/sbin/nft -f
# SymbiOS's firewall (desk SECURITY.md 3.4; Gab, 2026-10-31: TermNL's test servers blocked from the WiFi).
# Open: the USB cable, all of it (the computer it is plugged into). On the WiFi: SSH and the desk only.
# Anything started later (a test server, a new tool) stays closed until a line here opens it.
flush ruleset

table inet symbios {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    iifname { "usbbr", "usb0", "usb1" } accept             # the cable, its DHCP included
    meta l4proto { icmp, ipv6-icmp } accept               # ping, and IPv6's neighbours
    udp sport 67 udp dport 68 accept                       # the router's DHCP answers
    udp sport 547 udp dport 546 accept                     # the same for IPv6
    iifname "wlan0" tcp dport { 22, 80 } accept            # SSH, the desk
  }
  chain forward {
    type filter hook forward priority 0; policy drop;      # the board is not a router
  }
}
