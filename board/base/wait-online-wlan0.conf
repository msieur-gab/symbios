# SymbiOS: the boot and the daily update check wait for the WiFi only, never for the USB cable that may
# not be plugged in (desk SECURITY.md 3.7: the lists hadn't refreshed for two weeks because of it).
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --interface=wlan0 --any --timeout=60
